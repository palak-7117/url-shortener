<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftURL | Professional URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        header h1 span {
            color: var(--accent-color);
        }

        header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #ffffff;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result-box {
            margin-top: 28px;
            padding: 20px;
            background-color: #f1f5f9;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .result-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .link-output {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .link-output a {
            color: var(--accent-color);
            font-weight: 500;
            text-decoration: none;
            word-break: break-all;
            font-size: 15px;
        }

        .link-output a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            background: none;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 4px;
            width: auto;
            margin-top: 0;
        }

        .copy-btn:hover {
            background-color: rgba(37, 99, 235, 0.05);
        }

        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .qr-container img {
            max-width: 150px;
            background: white;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
        }
        .message.error { color: var(--error-color); }
        .message.success { color: var(--success-color); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Swift<span>URL</span></h1>
            <p>Clean, instant link optimization and tracking</p>
        </header>

        <div class="form-group">
            <label for="longUrl">Destination URL</label>
            <input type="url" id="longUrl" placeholder="https://example.com/very-long-link-goes-here" required>
        </div>

        <div class="form-group">
            <label for="customAlias">Custom Alias (Optional)</label>
            <input type="text" id="customAlias" placeholder="e.g., portfolio">
        </div>

        <button id="shortenBtn" onclick="processShorten()">Shorten Link</button>

        <div id="messageBox" class="message"></div>

        <div id="resultBox" class="result-box">
            <div class="result-title">Your Short Link</div>
            <div class="link-output">
                <a id="shortenedLink" href="#" target="_blank"></a>
                <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
            </div>
            <div class="qr-container">
                <div class="result-title" style="margin-bottom: 8px;">QR Code</div>
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <!-- QR Code Generation script dependency -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let qrInstance = null;

        async function processShorten() {
            const longUrl = document.getElementById('longUrl').value.trim();
            const customAlias = document.getElementById('customAlias').value.trim();
            const messageBox = document.getElementById('messageBox');
            const resultBox = document.getElementById('resultBox');
            const shortenBtn = document.getElementById('shortenBtn');

            // Clear states
            messageBox.className = "message";
            messageBox.innerText = "";
            resultBox.classList.remove('active');

            if (!longUrl) {
                messageBox.classList.add('error');
                messageBox.innerText = "Please enter a valid destination URL.";
                return;
            }

            shortenBtn.innerText = "Processing...";
            shortenBtn.disabled = true;

            try {
                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ long_url: longUrl, custom_alias: customAlias || null })
                });

                const data = await response.json();
                shortenBtn.innerText = "Shorten Link";
                shortenBtn.disabled = false;

                if (!response.ok) {
                    messageBox.classList.add('error');
                    messageBox.innerText = data.error || "An unexpected error occurred.";
                    return;
                }

                // Success routing
                if (data.message) {
                    messageBox.classList.add('success');
                    messageBox.innerText = data.message;
                }

                const displayLink = document.getElementById('shortenedLink');
                displayLink.href = data.real_url;
                displayLink.innerText = data.real_url;

                // Handle QR generation cleanly
                const qrDiv = document.getElementById('qrcode');
                qrDiv.innerHTML = "";
                qrInstance = new QRCode(qrDiv, {
                    text: data.real_url,
                    width: 140,
                    height: 140,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                resultBox.classList.add('active');

            } catch (err) {
                shortenBtn.innerText = "Shorten Link";
                shortenBtn.disabled = false;
                messageBox.classList.add('error');
                messageBox.innerText = "Connection failed. Please check your server status.";
            }
        }

        function copyToClipboard() {
            const linkText = document.getElementById('shortenedLink').href;
            navigator.clipboard.writeText(linkText).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                copyBtn.innerText = "Copied!";
                setTimeout(() => { copyBtn.innerText = "Copy"; }, 2000);
            });
        }
    </script>
</body>
</html>
