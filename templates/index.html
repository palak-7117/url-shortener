<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftURL | Modern URL Shortener & QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #070a14 100%);
            --card-bg: #151b2c;
            --border-color: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --accent-primary: #3b82f6;
            --accent-secondary: #2563eb;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            perspective: 1000px;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.08;
            z-index: 0;
        }
        body::before { top: 10%; left: 15%; background: var(--accent-primary); }
        body::after { bottom: 10%; right: 15%; background: var(--accent-secondary); }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 520px;
            text-align: center;
            z-index: 10;
            box-sizing: border-box;
            transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
            transform-style: preserve-3d;
        }

        h1 {
            color: var(--text-primary);
            font-size: 32px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            transform: translateZ(20px);
        }

        h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 32px;
            transform: translateZ(15px);
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
            transform: translateZ(10px);
        }

        .input-group label {
            display: block;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: #0f1423;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background: #111827;
        }

        input.input-error {
            border-color: var(--error-color);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        input::placeholder {
            color: #475569;
        }

        button.submit-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            transition: all 0.2s ease;
            transform: translateZ(15px);
        }

        button.submit-btn:hover {
            transform: translateZ(20px) translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        button.submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #errorBox {
            display: none;
            margin-top: 16px;
            padding: 14px 16px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            box-sizing: border-box;
            animation: fadeIn 0.3s ease forwards;
            transform: translateZ(10px);
        }

        #errorBox strong {
            color: var(--error-color);
        }

        #result {
            margin-top: 28px;
            padding: 24px;
            background: #0f1423;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: none;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease forwards;
            transform: translateZ(10px);
        }

        .result-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            text-align: left;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notice-msg {
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .output-link-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .output-label {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .link-action-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 2px;
        }

        .short-url-link {
            color: #60a5fa;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }

        .short-url-link:hover {
            color: #3b82f6;
            text-decoration: underline;
        }

        .copy-btn {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: rgba(37, 99, 235, 0.15);
            color: #3b82f6;
            border-color: rgba(37, 99, 235, 0.4);
        }

        .copy-btn.copied {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border-color: #22c55e;
        }

        .qr-wrapper {
            background: white;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .qr-wrapper img {
            width: 110px;
            height: 110px;
            display: block;
        }
    </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="container" id="tiltCard">
    <h1>Swift<span>URL</span></h1>
    <div class="subtitle">Shorten links & instantly generate QR codes</div>
    
    <div class="input-group">
        <label for="longUrl">Destination URL</label>
        <input type="url" id="longUrl" placeholder="https://example.com/very-long-link" required>
    </div>
    
    <div class="input-group">
        <label for="customAlias">Custom Alias (Optional)</label>
        <input type="text" id="customAlias" placeholder="e.g., myportfolio">
    </div>
    
    <button onclick="shortenLink()" class="submit-btn" id="submitBtn">Shorten URL</button>

    <div id="errorBox"></div>

    <div id="result"></div>
</div>

<script>
    // --- 1. MOVING POLKA-DOT BACKGROUND SYSTEM (Formal Blue-Slate Toned) ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
    const dots = [];
    const dotSpacing = 45;
    const baseRadius = 1.5;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initDots();
    }

    class Dot {
        constructor(x, y) { this.baseX = x; this.baseY = y; this.x = x; this.y = y; }
        update() {
            const dx = mouseX - this.baseX;
            const dy = mouseY - this.baseY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDistance = 180; 
            if (distance < maxDistance) {
                const force = (maxDistance - distance) / maxDistance;
                this.x = this.baseX - (dx / distance) * force * 15;
                this.y = this.baseY - (dy / distance) * force * 15;
            } else {
                this.x += (this.baseX - this.x) * 0.1;
                this.y += (this.baseY - this.y) * 0.1;
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, baseRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(59, 130, 246, 0.12)';
            ctx.fill();
        }
    }

    function initDots() {
        dots.length = 0;
        for (let x = dotSpacing / 2; x < canvas.width; x += dotSpacing) {
            for (let y = dotSpacing / 2; y < canvas.height; y += dotSpacing) {
                dots.push(new Dot(x, y));
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        mouseX += (targetMouseX - mouseX) * 0.08;
        mouseY += (targetMouseY - mouseY) * 0.08;
        dots.forEach(dot => { dot.update(); dot.draw(); });
        requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', (e) => { targetMouseX = e.clientX; targetMouseY = e.clientY; });
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animate();

    // --- 2. 3D TILT SYSTEM ---
    const card = document.getElementById('tiltCard');
    card.addEventListener('mousemove', (e) => {
        const cardRect = card.getBoundingClientRect();
        const cardX = e.clientX - cardRect.left - cardRect.width / 2;
        const cardY = e.clientY - cardRect.top - cardRect.height / 2;
        const angleX = -(cardY / cardRect.height) * 12;
        const angleY = (cardX / cardRect.width) * 12;
        card.style.transform = `rotateX(${angleX}deg) rotateY(${angleY}deg) scale3d(1.01, 1.01, 1.01)`;
        card.style.boxShadow = `${-angleY * 1.2}px ${angleX * 1.2}px 40px rgba(59, 130, 246, 0.15)`;
    });
    card.addEventListener('mouseleave', () => {
        card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        card.style.boxShadow = '0 24px 50px rgba(0, 0, 0, 0.4)';
    });

    // --- 3. COPY TO CLIPBOARD ANIMATION ---
    function copyLink(textToCopy, buttonElement) {
        navigator.clipboard.writeText(textToCopy).then(() => {
            buttonElement.classList.add('copied');
            buttonElement.innerText = "✓ Copied!";
            setTimeout(() => {
                buttonElement.classList.remove('copied');
                buttonElement.innerText = "Copy";
            }, 2000);
        }).catch(err => { alert("Failed to copy link."); });
    }

    // --- 4. ERROR DISPLAY HELPERS ---
    const errorBox = document.getElementById('errorBox');
    const longUrlInput = document.getElementById('longUrl');

    function showError(message) {
        errorBox.innerHTML = `<strong>⚠ Invalid link:</strong> ${message}`;
        errorBox.style.display = "block";
        longUrlInput.classList.add('input-error');
    }

    function clearError() {
        errorBox.style.display = "none";
        errorBox.innerHTML = "";
        longUrlInput.classList.remove('input-error');
    }

    // --- 5. BACKEND FLASK CONNECTIONS ---
    async function shortenLink() {
        const longUrl = document.getElementById('longUrl').value;
        const customAlias = document.getElementById('customAlias').value.trim();
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');

        clearError();
        resultDiv.style.display = "none";

        if (!longUrl) {
            showError("Please enter a URL first.");
            return;
        }

        if (!(longUrl.startsWith('http://') || longUrl.startsWith('https://'))) {
            showError("Invalid link. Please enter a URL which starts with http:// or https://");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Checking...";

        try {
            const response = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ long_url: longUrl, custom_alias: customAlias })
            });

            const data = await response.json();

            if (response.ok) {
                resultDiv.style.display = "block";
                let messageHtml = data.message ? `<div class="notice-msg">✨ Already mapped!</div>` : "";
                const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(data.real_url)}`;

                resultDiv.innerHTML = `
                    ${messageHtml}
                    <div class="result-layout">
                        <div class="output-link-container">
                            <div class="output-label">Your Shortened Link</div>
                            <div class="link-action-row">
                                <a href="${data.real_url}" target="_blank" class="short-url-link">${data.display_url}</a>
                                <button class="copy-btn" onclick="copyLink('${data.real_url}', this)">Copy</button>
                            </div>
                        </div>
                        <div class="qr-wrapper">
                            <img src="${qrCodeUrl}" alt="Link QR Code">
                        </div>
                    </div>
                `;
            } else {
                showError(data.error);
            }
        } catch (err) {
            showError("Could not connect to the server. Please try again.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Shorten URL";
        }
    }

    // Clear error as soon as the user starts fixing the input
    longUrlInput.addEventListener('input', clearError);
</script>

</body>
</html>
