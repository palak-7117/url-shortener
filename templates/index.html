<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek URL Shortener</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }
        h1 { color: #333; margin-bottom: 20px; }
        input[type="url"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 96%;
        }
        button:hover { background-color: #0056b3; }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: #e9f5ff;
            border-radius: 6px;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>URL Shortener</h1>
    <input type="url" id="longUrl" placeholder="Paste your long link here..." required>
    <button onclick="shortenLink()">Shorten URL</button>
    
    <div id="result"></div>
</div>

<script>
    async function shortenLink() {
        const longUrl = document.getElementById('longUrl').value;
        const resultDiv = document.getElementById('result');
        
        if (!longUrl) {
            alert("Please enter a URL first!");
            return;
        }

        try {
            // Send the long URL to your Flask backend
            const response = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ long_url: longUrl })
            });

            const data = await response.json();

            if (response.ok) {
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `<strong>Short Link:</strong> <a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
            } else {
                alert("Error: " + data.error);
            }
        } catch (err) {
            alert("Could not connect to backend.");
        }
    }
</script>

</body>
</html>
