<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Link Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #070a13 0%, #0f051d 100%);
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-color: rgba(239, 68, 68, 0.2); /* Red tint for error */
            --text-primary: #f8fafc;
            --accent-gradient: linear-gradient(135deg, #f43f5e 0%, #d946ef 100%); /* Red/Pink neon */
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            font-size: 64px;
            margin: 0;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #cbd5e1;
            font-size: 16px;
            margin: 16px 0 24px 0;
        }
        a {
            display: inline-block;
            background: linear-gradient(135deg, #06b6d4 0%, #d946ef 100%);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        a:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Oops! The link you are looking for has vanished into cyber space or never existed.</p>
        <a href="/">Go Back Home</a>
    </div>
</body>
</html>
